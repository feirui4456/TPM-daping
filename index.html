<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPM 智能全面生产维护可视化大屏 - 蓝色科技版</title>
    <!-- 引入 ECharts 库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* 全局复位与深蓝科技背景布局 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030b1e;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 162, 255, 0.12) 0%, transparent 75%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* 动态蓝色扫描线 */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 240, 255, 0.03) 50%, transparent 100%);
            background-size: 100% 8px;
            pointer-events: none;
            z-index: 1;
        }

        /* 顶部蓝色科技感标题栏 */
        .header {
            height: 60px;
            width: 100%;
            background: linear-gradient(180deg, rgba(5, 25, 55, 0.95) 0%, rgba(3, 12, 32, 0.65) 80%, transparent 100%);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: relative;
            z-index: 100;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 240, 255, 0.2) 30%, 
                #00f0ff 60%, 
                #a6f6ff 85%, 
                #ffffff 98%,
                transparent 100%
            );
            box-shadow: 0 0 15px #00f0ff, 0 -2px 10px rgba(0, 240, 255, 0.8);
            animation: flowLight 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes flowLight {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .header-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.8), 0 0 30px rgba(0, 162, 255, 0.5);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
            color: #8bb2d9;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid rgba(0, 255, 135, 0.4);
            padding: 2px 8px;
            border-radius: 12px;
            color: #00ff87;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(0, 255, 135, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #00ff87;
            box-shadow: 0 0 8px #00ff87;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px #00ff87; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .time-text {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00f0ff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        /* 核心网格布局 */
        .dashboard-container {
            width: 100%;
            height: calc(100vh - 60px);
            padding: 12px 16px;
            display: grid;
            grid-template-columns: 400px 1fr 400px;
            gap: 14px;
            position: relative;
            z-index: 10;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            overflow: hidden;
        }

        /* 蓝光科技卡片面板 */
        .card-panel {
            background: rgba(8, 24, 52, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        /* 四角科技微边装饰 */
        .card-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 6px; height: 6px;
            border-top: 2px solid #00f0ff;
            border-left: 2px solid #00f0ff;
        }
        .card-panel::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 6px; height: 6px;
            border-bottom: 2px solid #00f0ff;
            border-right: 2px solid #00f0ff;
        }

        .card-panel:hover {
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 8px 36px rgba(0, 240, 255, 0.2), inset 0 0 25px rgba(0, 240, 255, 0.1);
            transform: translateY(-2px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            position: relative;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 12px;
            background: #00f0ff;
            box-shadow: 0 0 8px #00f0ff;
            border-radius: 2px;
        }

        .panel-sub-tag {
            font-size: 11px;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 1px 6px;
            border-radius: 3px;
        }

        .chart-box {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        .stat-ring-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .stat-ring-item {
            background: rgba(0, 162, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 4px;
            padding: 4px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .stat-ring-item:hover {
            background: rgba(0, 240, 255, 0.18);
            border-color: rgba(0, 240, 255, 0.5);
        }

        .ring-value {
            font-size: 16px;
            font-weight: bold;
            font-family: 'Impact', sans-serif;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .ring-label {
            font-size: 10px;
            color: #8bb2d9;
            margin-top: 1px;
        }

        /* 中间核心板块 */
        .center-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .center-top-twin {
            flex: 1.5;
            width: 100%;
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.35);
            background: radial-gradient(circle at 50% 55%, rgba(0, 162, 255, 0.18) 0%, rgba(3, 11, 28, 0.95) 75%);
            user-select: none;
            cursor: grab;
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.15);
        }

        .center-bottom-log {
            flex: 1;
            min-height: 180px;
        }

        .floating-kpi-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 30;
            background: rgba(6, 20, 48, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            padding: 10px 14px;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.15);
            pointer-events: none;
        }

        .floating-kpi-title {
            font-size: 11px;
            color: #8bb2d9;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .floating-kpi-num {
            font-size: 28px;
            font-weight: 900;
            font-family: 'Impact', sans-serif;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
            line-height: 1;
            margin-bottom: 6px;
        }

        .kpi-sub-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 6px;
        }

        .kpi-sub-item {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .kpi-sub-item .label { color: #a3c7eb; }
        .kpi-sub-item .val { color: #00f0ff; font-weight: bold; }

        .twin-bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.4));
            opacity: 0.92;
            transform-origin: center center;
            transition: none;
            display: block;
            pointer-events: auto;
        }

        .twin-bg-image.resetting {
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        .spatial-tag {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(5, 22, 50, 0.9);
            border: 1px solid #00f0ff;
            padding: 4px 8px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            cursor: pointer;
            z-index: 25;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 1;
            pointer-events: auto;
        }

        .spatial-tag.tags-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spatial-tag:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.9);
        }

        .spatial-tag.alert {
            border-color: #ff4d4f;
            box-shadow: 0 0 15px rgba(255, 77, 79, 0.6);
            animation: alertPulse 1.5s infinite alternate;
        }

        @keyframes alertPulse {
            0% { box-shadow: 0 0 10px rgba(255, 77, 79, 0.5); border-color: #ff4d4f; }
            100% { box-shadow: 0 0 25px rgba(255, 77, 79, 1); border-color: #ff7875; }
        }

        .tag-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00f0ff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .spatial-tag.alert .tag-icon {
            background: #ff4d4f;
            color: #fff;
        }

        .tag-text {
            font-size: 11px;
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
        }

        #tag-filling { top: 38%; left: 32%; }
        #tag-labeling { top: 48%; left: 58%; }
        #tag-packing { top: 68%; left: 72%; }

        /* 流水实时日志表格 */
        .table-container {
            width: 100%;
            height: calc(100% - 28px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .table-head {
            display: grid;
            grid-template-columns: 1.5fr 1fr 3fr;
            padding: 6px 10px;
            background: rgba(0, 240, 255, 0.15);
            color: #00f0ff;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            margin-bottom: 4px;
            flex-shrink: 0;
            z-index: 2;
        }

        .table-body-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .table-scroll-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: listScroll 18s linear infinite;
        }

        .table-scroll-list:hover {
            animation-play-state: paused;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1.5fr 1fr 3fr;
            padding: 6px 10px;
            background: rgba(5, 20, 48, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 4px;
            font-size: 11px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .table-row:hover {
            background: rgba(0, 240, 255, 0.18);
            border-color: rgba(0, 240, 255, 0.4);
        }

        .badge-status {
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10px;
            text-align: center;
            width: fit-content;
        }
        .badge-status.red { background: rgba(255,77,79,0.2); color: #ff4d4f; border: 1px solid #ff4d4f; }
        .badge-status.orange { background: rgba(255,153,0,0.2); color: #ff9900; border: 1px solid #ff9900; }
        .badge-status.green { background: rgba(0,255,135,0.2); color: #00ff87; border: 1px solid #00ff87; }

        @keyframes listScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <span>整线车间：苏州智能三车间</span>
            <span class="status-badge"><span class="status-dot"></span> 飞书已联机</span>
        </div>
        <div class="header-title">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#00F0FF" stroke-width="2"/><path d="M2 17L12 22L22 17" stroke="#00F0FF" stroke-width="2"/><path d="M2 12L12 17L22 12" stroke="#00F0FF" stroke-width="2"/></svg>
            TPM 智能全面生产维护可视化大屏
        </div>
        <div class="header-right">
            <span class="time-text" id="clockText">--</span>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- 左侧面板 -->
        <div class="side-column">
            <div class="card-panel" style="flex: 1;">
                <div class="panel-header">
                    <span class="panel-title">整线 OEE 实时综合效率</span>
                    <span class="panel-sub-tag">数据驱动</span>
                </div>
                <div id="oeeChart" class="chart-box"></div>
            </div>

            <div class="card-panel" style="flex: 1;">
                <div class="panel-header">
                    <span class="panel-title">停机原因帕累托分析 (TOP5)</span>
                    <span class="panel-sub-tag">精益分析</span>
                </div>
                <div id="paretoChart" class="chart-box"></div>
            </div>

            <div class="card-panel" style="flex: 1;">
                <div class="panel-header">
                    <span class="panel-title">月度 TPM 点检与故障趋势</span>
                    <span class="panel-sub-tag">近30天</span>
                </div>
                <div id="monthlyTrendChart" class="chart-box"></div>
            </div>
        </div>

        <!-- 中间数字孪生与实时日志 -->
        <div class="center-column">
            <div class="center-top-twin" id="twinContainer">
                <div class="floating-kpi-panel">
                    <div class="floating-kpi-title">今日事件总数</div>
                    <div class="floating-kpi-num" id="kpiEventNum">0</div>
                    <div class="kpi-sub-list">
                        <div class="kpi-sub-item">
                            <span class="label">在线设备</span>
                            <span class="val" id="kpiRunDev">0</span>
                        </div>
                        <div class="kpi-sub-item">
                            <span class="label">待修工单</span>
                            <span class="val" style="color:#ff4d4f;" id="kpiRepairDev">0</span>
                        </div>
                        <div class="kpi-sub-item">
                            <span class="label">计划达标率</span>
                            <span class="val" style="color:#00ff87;" id="kpiTargetRate">0%</span>
                        </div>
                    </div>
                </div>

                <img id="twinImg" src="./2d9a18af6b59a449fc332d0044cdb433.png" class="twin-bg-image" alt="设备全景空间映射">
                
                <div class="spatial-tag alert" id="tag-filling">
                    <div class="tag-icon">!</div>
                    <div class="tag-text">01号灌装机：气缸卡阻</div>
                </div>

                <div class="spatial-tag" id="tag-labeling">
                    <div class="tag-icon">P</div>
                    <div class="tag-text">04号套标机：传感器偏置</div>
                </div>

                <div class="spatial-tag" id="tag-packing" style="border-color:#00ff87;">
                    <div class="tag-icon" style="background:#00ff87;">✓</div>
                    <div class="tag-text">06号包装机：正常运行</div>
                </div>
            </div>

            <div class="card-panel center-bottom-log">
                <div class="panel-header">
                    <span class="panel-title">飞书流水实时日志</span>
                    <span class="panel-sub-tag">自动同步</span>
                </div>
                <div class="table-container">
                    <div class="table-head">
                        <div>设备名称</div>
                        <div>状态</div>
                        <div>最新触发事件</div>
                    </div>
                    <div class="table-body-wrapper">
                        <div class="table-scroll-list" id="logScrollList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="side-column">
            <div class="card-panel" style="flex: 1.2;">
                <div class="panel-header">
                    <span class="panel-title">主要 TPM 可靠性指标</span>
                    <span class="panel-sub-tag">量化对比</span>
                </div>
                <!-- 6大 TPM 可靠性指标：动态绑定 ID -->
                <div class="stat-ring-grid">
                    <div class="stat-ring-item">
                        <div class="ring-value" id="kpiMtbf">0h</div>
                        <div class="ring-label">MTBF间隔</div>
                    </div>
                    <div class="stat-ring-item">
                        <div class="ring-value" style="color:#ff4d4f;" id="kpiMttr">0h</div>
                        <div class="ring-label">MTTR修复</div>
                    </div>
                    <div class="stat-ring-item">
                        <div class="ring-value" style="color:#00ff87;" id="kpiYieldRate">0%</div>
                        <div class="ring-label">良品率</div>
                    </div>
                    <div class="stat-ring-item">
                        <div class="ring-value" id="kpiTimeOee">0%</div>
                        <div class="ring-label">时间稼动</div>
                    </div>
                    <div class="stat-ring-item">
                        <div class="ring-value" style="color:#ffe066;" id="kpiPerfOee">0%</div>
                        <div class="ring-label">性能稼动</div>
                    </div>
                    <div class="stat-ring-item">
                        <div class="ring-value" id="kpiPmRate">0%</div>
                        <div class="ring-label">PM完成率</div>
                    </div>
                </div>
                <div id="mtbfChart" class="chart-box"></div>
            </div>

            <div class="card-panel" style="flex: 1;">
                <div class="panel-header">
                    <span class="panel-title">设备故障类型结构占比</span>
                    <span class="panel-sub-tag">动态高亮</span>
                </div>
                <div id="structureRingChart" class="chart-box"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. 顶部实时时钟
        function updateClock() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockText').innerText = `${y}-${m}-${d} ${hh}:${mm}:${ss}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. CountUp 数字缓动上升函数
        function animateValue(id, start, end, duration = 1200, suffix = '') {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                
                if (Number.isInteger(end)) {
                    obj.innerText = Math.floor(easeProgress * (end - start) + start) + suffix;
                } else {
                    obj.innerText = (easeProgress * (end - start) + start).toFixed(1) + suffix;
                }

                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerText = end + suffix;
                }
            };
            window.requestAnimationFrame(step);
        }

        // 3. 初始化 ECharts 实例
        const oeeChart = echarts.init(document.getElementById('oeeChart'));
        const paretoChart = echarts.init(document.getElementById('paretoChart'));
        const monthlyTrendChart = echarts.init(document.getElementById('monthlyTrendChart'));
        const mtbfChart = echarts.init(document.getElementById('mtbfChart'));
        const structureRingChart = echarts.init(document.getElementById('structureRingChart'));

        // 蓝色系高对比配色
        const techBlueColors = ['#00f0ff', '#1890ff', '#36cfc9', '#096dd9', '#0050b3'];

        // 4. 数据异步获取与渲染
        async function loadDashboardData() {
            try {
                const response = await fetch('./data.json?t=' + Date.now());
                if (!response.ok) throw new Error('无法获取 data.json');
                
                const data = await response.json();
                
                renderKPI(data.kpi);
                renderOEE(data.kpi ? parseFloat(data.kpi.oeeValue) : 0);
                renderPareto(data.pareto);
                renderMonthlyTrend(data.monthlyTrend);
                renderMTBF(data.mtbf);
                renderStructure(data.structure);
                renderLogs(data.logs);

                console.log('✅ 蓝色科技版 TPM 大屏数据同步完成！');
            } catch (err) {
                console.error('❌ 加载 data.json 出错:', err);
            }
        }

        function renderKPI(kpi) {
            if (!kpi) return;
            
            // 顶部与悬浮卡片 KPI
            if (kpi.eventNum !== undefined) animateValue('kpiEventNum', 0, parseInt(kpi.eventNum));
            if (kpi.runDev !== undefined) animateValue('kpiRunDev', 0, parseInt(kpi.runDev));
            if (kpi.repairDev !== undefined) animateValue('kpiRepairDev', 0, parseInt(kpi.repairDev));
            if (kpi.targetRate !== undefined) animateValue('kpiTargetRate', 0, parseFloat(kpi.targetRate), 1200, '%');

            // 6 大 TPM 可靠性指标 (来自 data.json)
            if (kpi.mtbf !== undefined) animateValue('kpiMtbf', 0, parseFloat(kpi.mtbf), 1200, 'h');
            if (kpi.mttr !== undefined) animateValue('kpiMttr', 0, parseFloat(kpi.mttr), 1200, 'h');
            if (kpi.yieldRate !== undefined) animateValue('kpiYieldRate', 0, parseFloat(kpi.yieldRate), 1200, '%');
            if (kpi.timeOee !== undefined) animateValue('kpiTimeOee', 0, parseFloat(kpi.timeOee), 1200, '%');
            if (kpi.perfOee !== undefined) animateValue('kpiPerfOee', 0, parseFloat(kpi.perfOee), 1200, '%');
            if (kpi.pmRate !== undefined) animateValue('kpiPmRate', 0, parseFloat(kpi.pmRate), 1200, '%');
        }

        // 蓝色科技风 Gauge 仪表盘
        function renderOEE(val) {
            oeeChart.setOption({
                animationDuration: 1800,
                animationEasingUpdate: 'cubicOut',
                tooltip: { formatter: '{a} <br/>{b} : {c}%' },
                series: [{
                    name: 'OEE',
                    type: 'gauge',
                    startAngle: 200,
                    endAngle: -20,
                    min: 0,
                    max: 100,
                    radius: '95%',
                    center: ['50%', '55%'],
                    progress: {
                        show: true,
                        width: 10,
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                { offset: 0, color: '#096dd9' },
                                { offset: 0.5, color: '#1890ff' },
                                { offset: 1, color: '#00f0ff' }
                            ])
                        }
                    },
                    axisLine: { lineStyle: { width: 10, color: [[1, 'rgba(0,240,255,0.1)']] } },
                    pointer: { itemStyle: { color: '#00f0ff' }, width: 3, length: '52%' },
                    axisTick: { show: false },
                    splitLine: { length: 5, lineStyle: { color: '#00f0ff', width: 1.5 } },
                    axisLabel: { color: '#8bb2d9', fontSize: 9, distance: 8 },
                    title: {
                        show: true,
                        offsetCenter: [0, '35%'],
                        textStyle: { color: '#8bb2d9', fontSize: 11, fontWeight: 'normal' }
                    },
                    detail: {
                        valueAnimation: true,
                        formatter: '{value}%',
                        color: '#00f0ff',
                        fontSize: 22,
                        fontWeight: 'bold',
                        offsetCenter: [0, '-8%']
                    },
                    data: [{ value: val, name: '综合效率' }]
                }]
            });
        }

        // 蓝色帕累托混合图
        function renderPareto(pareto) {
            if (!pareto) return;
            paretoChart.setOption({
                animationDuration: 1500,
                grid: { top: '22%', bottom: '15%', left: '10%', right: '10%' },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                xAxis: {
                    type: 'category',
                    data: pareto.categories || [],
                    axisLine: { lineStyle: { color: 'rgba(0,240,255,0.3)' } },
                    axisLabel: { color: '#a3c7eb', fontSize: 10 }
                },
                yAxis: [
                    { type: 'value', splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }, axisLabel: { color: '#8bb2d9', fontSize: 10 } },
                    { type: 'value', max: 100, splitLine: { show: false }, axisLabel: { formatter: '{value}%', color: '#8bb2d9', fontSize: 10 } }
                ],
                series: [
                    {
                        name: '停机(h)',
                        type: 'bar',
                        barWidth: '35%',
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#00f0ff' },
                                { offset: 1, color: 'rgba(0, 80, 179, 0.2)' }
                            ]),
                            borderRadius: [4, 4, 0, 0]
                        },
                        data: pareto.hours || []
                    },
                    {
                        name: '累计%',
                        type: 'line',
                        yAxisIndex: 1,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        itemStyle: { color: '#ffffff' },
                        lineStyle: { width: 2.5, color: '#ffffff' },
                        data: pareto.ratios || []
                    }
                ]
            });
        }

        // 青蓝渐变面积趋势图
        function renderMonthlyTrend(trend) {
            if (!trend) return;
            monthlyTrendChart.setOption({
                animationDuration: 1800,
                grid: { top: '18%', bottom: '15%', left: '8%', right: '5%', containLabel: true },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: trend.months || [],
                    axisLine: { lineStyle: { color: 'rgba(0,240,255,0.3)' } },
                    axisLabel: { color: '#8bb2d9', fontSize: 10 }
                },
                yAxis: {
                    type: 'value',
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
                    axisLabel: { color: '#8bb2d9', fontSize: 10 }
                },
                series: [
                    {
                        name: '故障率',
                        type: 'line',
                        smooth: true,
                        showSymbol: false,
                        lineStyle: { width: 3, color: '#00f0ff' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0, 240, 255, 0.45)' },
                                { offset: 1, color: 'rgba(0, 240, 255, 0)' }
                            ])
                        },
                        data: trend.rates || []
                    }
                ]
            });
        }

        // 双柱对比图
        function renderMTBF(mtbf) {
            if (!mtbf) return;
            mtbfChart.setOption({
                animationDuration: 1500,
                grid: { top: '18%', bottom: '12%', left: '8%', right: '5%', containLabel: true },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: mtbf.devices || [],
                    axisLine: { lineStyle: { color: 'rgba(0,240,255,0.3)' } },
                    axisLabel: { color: '#8bb2d9', fontSize: 10 }
                },
                yAxis: {
                    type: 'value',
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
                    axisLabel: { color: '#8bb2d9', fontSize: 10 }
                },
                series: [
                    {
                        name: 'MTBF',
                        type: 'bar',
                        barWidth: '25%',
                        itemStyle: { color: '#00f0ff', borderRadius: [2, 2, 0, 0] },
                        data: mtbf.mtbfData || []
                    },
                    {
                        name: 'MTTR',
                        type: 'bar',
                        barWidth: '25%',
                        itemStyle: { color: '#ff4d4f', borderRadius: [2, 2, 0, 0] },
                        data: mtbf.mttrData || []
                    }
                ]
            });
        }

        // 蓝色环形饼图与轮播高亮
        let structureTimer = null;
        function renderStructure(structure) {
            if (!structure) return;
            structureRingChart.setOption({
                color: techBlueColors,
                tooltip: { trigger: 'item', formatter: '{a} <br/>{b}: {c} ({d}%)' },
                legend: { 
                    orient: 'vertical', 
                    right: '2%', 
                    top: 'center', 
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: { color: '#8bb2d9', fontSize: 10 } 
                },
                series: [
                    {
                        name: '故障类型',
                        type: 'pie',
                        radius: ['42%', '70%'],
                        center: ['35%', '50%'],
                        avoidLabelOverlap: false,
                        itemStyle: { borderRadius: 4, borderColor: '#030b1e', borderWidth: 2 },
                        label: { show: false },
                        emphasis: {
                            label: { show: true, fontSize: 12, fontWeight: 'bold', color: '#fff' }
                        },
                        data: structure
                    }
                ]
            });

            // 自动轮播高亮动画
            let currentIndex = -1;
            if (structureTimer) clearInterval(structureTimer);
            structureTimer = setInterval(() => {
                const dataLen = structure.length;
                structureRingChart.dispatchAction({ type: 'downplay', seriesIndex: 0, dataIndex: currentIndex });
                currentIndex = (currentIndex + 1) % dataLen;
                structureRingChart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: currentIndex });
                structureRingChart.dispatchAction({ type: 'showTip', seriesIndex: 0, dataIndex: currentIndex });
            }, 3000);
        }

        function renderLogs(logs) {
            const container = document.getElementById('logScrollList');
            if (!container || !logs || !logs.length) return;

            const renderList = [...logs, ...logs];
            container.innerHTML = renderList.map(item => `
                <div class="table-row">
                    <div>${item.device}</div>
                    <div><span class="badge-status ${item.status}">${item.statusText}</span></div>
                    <div>${item.event}</div>
                </div>
            `).join('');
        }

        // 5. 空间图像平移缩放、点位隐现与复位
        function initTwinImageZoom() {
            const container = document.getElementById('twinContainer');
            const img = document.getElementById('twinImg');
            const tags = document.querySelectorAll('.spatial-tag');
            if (!container || !img) return;

            img.addEventListener('dragstart', (e) => e.preventDefault());

            let scale = 1;
            let translateX = 0;
            let translateY = 0;

            const minScale = 0.5;
            const maxScale = 3.5;
            const step = 0.15;
            let resetTimer = null;

            let isDragging = false;
            let startMouseX = 0;
            let startMouseY = 0;

            function updateTagsVisibility() {
                const isTransformed = Math.abs(scale - 1) > 0.01 || Math.abs(translateX) > 2 || Math.abs(translateY) > 2;
                tags.forEach(tag => {
                    if (isTransformed) {
                        tag.classList.add('tags-hidden');
                    } else {
                        tag.classList.remove('tags-hidden');
                    }
                });
            }

            function updateTransform() {
                img.style.transform = `translate(calc(-50% + ${translateX}px), calc(-50% + ${translateY}px)) scale(${scale})`;
                updateTagsVisibility();
            }

            function startResetTimer() {
                if (resetTimer) clearTimeout(resetTimer);
                img.classList.remove('resetting');

                resetTimer = setTimeout(() => {
                    scale = 1;
                    translateX = 0;
                    translateY = 0;
                    img.classList.add('resetting');
                    updateTransform();
                }, 10000);
            }

            updateTransform();

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    scale = Math.min(maxScale, scale + step);
                } else {
                    scale = Math.max(minScale, scale - step);
                }
                updateTransform();
                startResetTimer();
            }, { passive: false });

            container.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                startMouseX = e.clientX - translateX;
                startMouseY = e.clientY - translateY;

                container.style.cursor = 'grabbing';
                img.classList.remove('resetting');
                if (resetTimer) clearTimeout(resetTimer);
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                translateX = e.clientX - startMouseX;
                translateY = e.clientY - startMouseY;
                updateTransform();
            });

            window.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                container.style.cursor = 'grab';
                startResetTimer();
            });
        }

        // 6. 首次加载与页面事件
        window.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            initTwinImageZoom();
            setInterval(loadDashboardData, 60000);
        });

        // 7. 窗口响应缩放
        window.addEventListener('resize', () => {
            oeeChart.resize();
            paretoChart.resize();
            monthlyTrendChart.resize();
            mtbfChart.resize();
            structureRingChart.resize();
        });
    </script>
</body>
</html>
