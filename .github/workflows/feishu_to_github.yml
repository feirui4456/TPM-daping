name: Feishu to GitHub Data Sync

on:
  # 支持定时自动拉取（例如每 30 分钟同步一次）
  schedule:
    - cron: '*/30 * * * *'

  # 支持外部 HTTP Webhook 触发
  repository_dispatch:
    types: [feishu_sync]

  # 支持在 GitHub Actions 界面手动点击触发
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行 Python 脚本更新本地 data.json
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python sync_feishu.py

      - name: 提交更新到 Git 仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --staged --quiet; then
            echo "ℹ️ 数据未发生任何变化，无需提交。"
          else
            git commit -m "chore(data): 自动同步飞书最新看板数据 [skip ci]"
            git push
          fi
